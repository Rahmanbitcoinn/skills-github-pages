  .hero::before{
    /* soft cyan/blue atmospheric glow, also helps mask the lower-right area (hand/strap) */
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(220px 180px at 88% 78%, rgba(4,7,17,0.92), transparent 70%),
      radial-gradient(260px 200px at 10% 8%, rgba(95,227,255,0.28), transparent 65%),
      radial-gradient(220px 200px at 95% 10%, rgba(78,140,255,0.25), transparent 65%);
    pointer-events:none;
  }
  .hero::after{
    content:'';
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(190,225,255,0.12) 1px, transparent 1.4px);
    background-size: 24px 24px;
    opacity:0.35;
    pointer-events:none;
  }
  .hero-top{
    position:relative;
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 20px 20px 0;
    z-index:2;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .brand-mark{
    width:30px;height:30px;border-radius:9px;
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    box-shadow: 0 0 16px rgba(95,227,255,0.65), 0 0 0 1px rgba(255,255,255,0.25) inset;
    display:flex;align-items:center;justify-content:center;
    font-size:14px; font-weight:800; color:#04101f;
  }
  .brand-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:17px;
    letter-spacing: -0.01em;
    color:#fff;
  }
  .hero-date{
    font-size:11px;
    color: var(--ink-soft);
    background: rgba(6,12,26,0.45);
    border:1px solid var(--line-soft);
    padding:5px 10px;
    border-radius:999px;
    backdrop-filter: blur(6px);
  }

  .hero-tag{
    position:relative;
    z-index:2;
    margin: 74px 20px 0;
    font-size:12px;
    color: var(--cyan);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight:600;
    text-shadow: 0 0 12px rgba(95,227,255,0.5);
  }
  .hero-headline{
    position:relative;
    z-index:2;
    margin: 6px 20px 0;
    font-family:'Space Grotesk',sans-serif;
    font-size: 15px;
    color: var(--ink-soft);
    max-width: 220px;
    line-height:1.4;
  }

  /* ---------- floating glass balance card ---------- */
  .balance-card{
    position: relative;
    z-index: 3;
    margin: 18px 16px -46px;
    padding: 18px 18px 20px;
    border-radius: 22px;
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.03) inset,
      0 20px 45px -18px rgba(0,0,0,0.65),
      0 0 30px -8px rgba(95,227,255,0.35);
  }
  .balance-row{
    display:flex;
    justify-content: space-between;
    align-items:flex-end;
  }
  .balance-main .lbl{
    font-size:11px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .balance-main .amt{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size: 26px;
    color:#fff;
  }
  .balance-main .amt .chg{
    font-size: 12px;
    font-weight:600;
    margin-left:8px;
    vertical-align: middle;
    padding: 2px 7px;
    border-radius: 999px;
  }
  .chg.up{ color: var(--green); background: rgba(57,255,194,0.12); }
  .chg.down{ color: var(--red); background: rgba(255,107,139,0.12); }
  .balance-mini{
    text-align:right;
    font-size:11px;
    line-height:1.6;
  }
  .balance-mini .in{ color: var(--green); }
  .balance-mini .out{ color: var(--red); }
  .balance-mini span{ color:#fff; font-weight:600; }

  /* spacer under floating card */
  .hero-spacer{ height: 56px; }

  /* ---------- content ---------- */
  section{ display:none; padding: 0 18px 18px; }
  section.active{ display:block; }

  .sec-title{
    font-family:'Space Grotesk',sans-serif;
    font-size: 15px;
    font-weight:700;
    color:#fff;
    margin: 6px 0 14px;
  }

  .segmented{
    display:flex;
    background: var(--glass);
    border:1px solid var(--line-soft);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .segmented button{
    flex:1;
    border:none;
    background: transparent;
    color: var(--ink-soft);
    font-weight:600;
    font-size:13px;
    padding: 9px 0;
    border-radius: 10px;
    cursor:pointer;
    transition: all 0.2s ease;
  }
  .segmented button.on.keluar{
    background: linear-gradient(135deg, rgba(255,107,139,0.85), rgba(255,107,139,0.55));
    color:#fff;
    box-shadow: 0 6px 16px -4px rgba(255,107,139,0.55);
  }
  .segmented button.on:not(.keluar){
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    color:#04101f;
    box-shadow: 0 6px 16px -4px rgba(95,227,255,0.55);
  }

  .field{ margin-bottom: 13px; }
  .field label{
    display:block;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight:600;
  }
  .field input, .field select{
    width:100%;
    padding: 12px 14px;
    border-radius: 13px;
    border: 1px solid var(--line-soft);
    background: rgba(10,16,32,0.55);
    color:#fff;
    font-size: 14px;
    outline:none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .field input:focus, .field select:focus{
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(95,227,255,0.18);
  }

  .btn-primary{
    width:100%;
    padding: 14px 0;
    border:none;
    border-radius: 15px;
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    color:#04101f;
    font-weight:800;
    font-size: 14.5px;
    letter-spacing: 0.01em;
    cursor:pointer;
    box-shadow: 0 12px 28px -10px rgba(78,140,255,0.65), 0 0 0 1px rgba(255,255,255,0.15) inset;
    transition: transform .15s ease, filter .15s ease;
  }
  .btn-primary:active{ transform: translateY(1px) scale(0.99); }

  .empty{
    text-align:center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 40px 10px;
  }

  .day-group{ margin-bottom: 16px; }
  .day-head{
    display:flex; justify-content: space-between;
    font-size: 11.5px;
    color: var(--ink-soft);
    padding: 0 4px 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .tx-row{
    display:flex; justify-content: space-between; align-items:center;
    background: var(--glass);
    border: 1px solid var(--line-soft);
    border-radius: 15px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .tx-cat{ font-size:13.5px; font-weight:600; color:#fff; }
  .tx-note{ font-size: 11.5px; color: var(--ink-soft); margin-top:2px; }
  .tx-amt{ font-weight:700; font-size:14px; }
  .tx-amt.in{ color: var(--green); }
  .tx-amt.out{ color: var(--red); }
  .tx-del{
    margin-top:4px;
    border:none; background:none;
    color: var(--ink-soft);
    font-size: 10.5px;
    text-decoration: underline;
    cursor:pointer;
  }

  .budget-card{
    background: var(--glass);
    border:1px solid var(--line-soft);
    border-radius: 15px;
    padding: 13px 15px;
    margin-bottom: 10px;
  }
  .bc-top{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:8px; }
  .bc-top .nm{ font-weight:700; color:#fff; }
  .bc-top .nums{ color: var(--ink-soft); }
  .bar-track{ height:7px; border-radius:999px; background: rgba(255,255,255,0.08); overflow:hidden; }
  .bar-fill{ height:100%; background: linear-gradient(90deg, var(--cyan), var(--blue)); border-radius: 999px; }
  .bar-fill.over{ background: linear-gradient(90deg, #FF6B8B, #FF3B7C); }

  .subhead{
    font-size: 12px;
    font-weight:700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 20px 2px 10px;
  }
  .grid3{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }

  .month-card{
    background: var(--glass);
    border:1px solid var(--line-soft);
    border-radius: 16px;
    padding: 15px 16px;
    margin-bottom: 12px;
  }
  .m-name{ font-family:'Space Grotesk',sans-serif; font-weight:700; color:#fff; font-size:14px; margin-bottom:8px; }
  .m-line{ display:flex; justify-content:space-between; font-size:12.5px; color: var(--ink-soft); padding:3px 0; }
  .m-line .v{ color:#fff; font-weight:600; }
  .m-line.total{ border-top:1px solid var(--line-soft); margin-top:6px; padding-top:8px; }
  .m-line.total .v{ color: var(--cyan); font-weight:700; }

  /* ---------- bottom nav (neo-tactile) ---------- */
  nav.tabs{
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 448px;
    display:flex;
    background: var(--glass-strong);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 8px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 20px 40px -16px rgba(0,0,0,0.7), 0 0 24px -6px rgba(95,227,255,0.25);
    z-index: 40;
  }
  nav.tabs button{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    border:none; background:none;
    color: var(--ink-soft);
    font-size: 10.5px;
    font-weight:600;
    padding: 7px 0;
    border-radius: 13px;
    cursor:pointer;
    transition: all .2s ease;
  }
  nav.tabs button .ic{ font-size:16px; }
  nav.tabs button.active{
    color:#04101f;
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    box-shadow: 0 8px 18px -6px rgba(95,227,255,0.6);
  }

  .toast{
    position: fixed;
    bottom: 92px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10,16,32,0.92);
    border: 1px solid var(--line);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 12.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 50;
    max-width: 90%;
    text-align:center;
    box-shadow: 0 0 20px -4px rgba(95,227,255,0.4);
  }
  .toast.show{ opacity: 1; }
</style>

      </div>
      <div class="balance-mini">
        <div class="in">masuk <span id="miniIn">Rp0</span></div>
        <div class="out">keluar <span id="miniOut">Rp0</span></div>
      </div>
    </div>
  </div>
  <div class="hero-spacer"></div>

  <!-- CATAT -->
  <section id="tab-catat" class="active">
    <h2 class="sec-title">Catat transaksi</h2>
    <div class="segmented" id="jenisSeg">
      <button type="button" data-v="keluar" class="on keluar">Keluar</button>
      <button type="button" data-v="masuk">Masuk</button>
    </div>

    <div class="field">
      <label>Tanggal</label>
      <input type="date" id="fTanggal">
    </div>
    <div class="field">
      <label>Kategori</label>
      <select id="fKategori"></select>
    </div>
    <div class="field">
      <label>Nominal (Rp)</label>
      <input type="number" id="fNominal" placeholder="0" inputmode="numeric">
    </div>
    <div class="field">
      <label>Catatan (opsional)</label>
      <input type="text" id="fCatatan" placeholder="mis. jajan siang">
    </div>
    <button class="btn-primary" id="btnSimpan">Simpan</button>
  </section>

  <!-- RIWAYAT -->
  <section id="tab-riwayat">
    <h2 class="sec-title">Riwayat</h2>
    <div id="riwayatList"></div>
  </section>

  <!-- ANGGARAN -->
  <section id="tab-anggaran">
    <h2 class="sec-title">Jatah harian &amp; anggaran</h2>
    <div id="budgetProgress"></div>

    <div class="subhead">Atur jatah spending (per bulan berjalan)</div>
    <div id="budgetEditor"></div>

    <div class="subhead">Atur pemasukan tetap</div>
    <div id="incomeEditor"></div>

    <div class="subhead">Saldo awal</div>
    <div class="field">
      <label>Saldo awal bulan ini (Rp)</label>
      <input type="number" id="fSaldoAwal">
    </div>
    <button class="btn-primary" id="btnSimpanAnggaran">Simpan pengaturan</button>
  </section>

  <!-- RINGKASAN -->
  <section id="tab-ringkasan">
    <h2 class="sec-title">Ringkasan bulanan</h2>
    <div id="ringkasanList"></div>
  </section>

  <nav class="tabs">
    <button data-tab="catat" class="active"><span class="ic">✎</span>Catat</button>
    <button data-tab="riwayat"><span class="ic">≡</span>Riwayat</button>
    <button data-tab="anggaran"><span class="ic">◔</span>Anggaran</button>
    <button data-tab="ringkasan"><span class="ic">▤</span>Ringkasan</button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){

  // ---------- helpers ----------
  const rupiah = n => 'Rp' + Math.round(n).toLocaleString('id-ID');
  const todayISO = () => new Date().toISOString().slice(0,10);
  const monthKey = iso => iso.slice(0,7);
  const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const monthLabel = mk => { const [y,m]=mk.split('-'); return monthNames[parseInt(m,10)-1] + ' ' + y; };

  function toast(msg){
    const t=document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h=setTimeout(()=>t.classList.remove('show'), 1800);
  }

  const DEFAULT_CONFIG = {
    saldoAwal: 290000,
    saldoAwalBulan: monthKey(todayISO()),
    income: {
      saku:   { label:'Saku (fleksibel)', bulanan: 240000 },
      bonus:  { label:'Bonus (tetap)',    bulanan: 140000 },
      bantu:  { label:'Bantu (tetap)',    bulanan: 140000 }
    },
    budget: {
      kas:   { label:'Kas',              bulanan: 12000  },
      kuota: { label:'Kuota',            bulanan: 35000  },
      jajan: { label:'Jajan & hiburan',  bulanan: 57000  }
    }
  };

  const KAT_KELUAR = ['kas','kuota','jajan','lainnya'];
  const KAT_MASUK  = ['saku','bonus','bantu','lainnya'];

  let CONFIG = null;
  let TX = [];

  const LS_CONFIG = 'manfinanxe_config';
  const LS_TX = 'manfinanxe_transactions';

  async function loadAll(){
    try{
      const c = localStorage.getItem(LS_CONFIG);
      CONFIG = c ? JSON.parse(c) : JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    }catch(e){ CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG)); }

    try{
      const t = localStorage.getItem(LS_TX);
      TX = t ? JSON.parse(t) : [];
    }catch(e){ TX = []; }
  }

  async function saveConfig(){
    try{ localStorage.setItem(LS_CONFIG, JSON.stringify(CONFIG)); }
    catch(e){ toast('Gagal menyimpan pengaturan'); }
  }
  async function saveTx(){
    try{ localStorage.setItem(LS_TX, JSON.stringify(TX)); }
    catch(e){ toast('Gagal menyimpan transaksi'); }
  }

  function computeSaldo(){
    const totalIn = TX.filter(t=>t.type==='masuk').reduce((s,t)=>s+t.amount,0);
    const totalOut = TX.filter(t=>t.type==='keluar').reduce((s,t)=>s+t.amount,0);
    return { saldo: CONFIG.saldoAwal + totalIn - totalOut, totalIn, totalOut };
  }

  function renderHeader(){
    const d = new Date();
    document.getElementById('hdrDate').textContent =
      d.toLocaleDateString('id-ID', { day:'numeric', month:'short' });
    const { saldo, totalIn, totalOut } = computeSaldo();
    document.getElementById('saldoNow').firstChild.textContent = rupiah(saldo);
    document.getElementById('miniIn').textContent = rupiah(totalIn);
    document.getElementById('miniOut').textContent = rupiah(totalOut);

    const basis = Math.abs(CONFIG.saldoAwal) || 1;
    const pct = ((saldo - CONFIG.saldoAwal) / basis) * 100;
    const chg = document.getElementById('saldoChg');
    if(Math.abs(pct) < 0.05){
      chg.textContent = '';
      chg.className = 'chg';
    } else {
      chg.textContent = (pct>0?'▲ ':'▼ ') + Math.abs(pct).toFixed(1) + '%';
      chg.className = 'chg ' + (pct>0?'up':'down');
    }
  }

  document.querySelectorAll('nav.tabs button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
      if(btn.dataset.tab==='riwayat') renderRiwayat();
      if(btn.dataset.tab==='anggaran') renderAnggaran();
      if(btn.dataset.tab==='ringkasan') renderRingkasan();
    });
  });

  let jenisAktif = 'keluar';
  document.querySelectorAll('#jenisSeg button').forEach(b=>{
    b.addEventListener('click', ()=>{
      jenisAktif = b.dataset.v;
      document.querySelectorAll('#jenisSeg button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      populateKategori();
    });
  });

  function populateKategori(){
    const sel = document.getElementById('fKategori');
    sel.innerHTML='';
    const src = jenisAktif==='masuk' ? CONFIG.income : CONFIG.budget;
    const keys = jenisAktif==='masuk' ? KAT_MASUK : KAT_KELUAR;
    keys.forEach(k=>{
      const opt=document.createElement('option');
      opt.value=k;
      opt.textContent = (src[k] && src[k].label) ? src[k].label : (k.charAt(0).toUpperCase()+k.slice(1));
      sel.appendChild(opt);
    });
  }

  document.getElementById('fTanggal').value = todayISO();

  document.getElementById('btnSimpan').addEventListener('click', async ()=>{
    const nominal = parseFloat(document.getElementById('fNominal').value);
    const tanggal = document.getElementById('fTanggal').value || todayISO();
    const kategori = document.getElementById('fKategori').value;
    const catatan = document.getElementById('fCatatan').value.trim();

    if(!nominal || nominal<=0){ toast('Isi nominal dulu ya'); return; }

    TX.push({
      id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      type: jenisAktif,
      category: kategori,
      amount: nominal,
      note: catatan,
      date: tanggal
    });
    await saveTx();
    document.getElementById('fNominal').value='';
    document.getElementById('fCatatan').value='';
    renderHeader();
    toast('Tersimpan');
  });

  function renderRiwayat(){
    const wrap = document.getElementById('riwayatList');
    if(TX.length===0){
      wrap.innerHTML = '<div class="empty">Belum ada transaksi. Mulai catat di tab Catat.</div>';
      return;
    }
    const byDate = {};
    TX.slice().sort((a,b)=> b.date.localeCompare(a.date) || 0).forEach(t=>{
      byDate[t.date] = byDate[t.date] || [];
      byDate[t.date].push(t);
    });

    let html='';
    Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).forEach(date=>{
      const rows = byDate[date];
      const dayIn = rows.filter(r=>r.type==='masuk').reduce((s,r)=>s+r.amount,0);
      const dayOut = rows.filter(r=>r.type==='keluar').reduce((s,r)=>s+r.amount,0);
      const dObj = new Date(date+'T00:00:00');
      const label = dObj.toLocaleDateString('id-ID', {weekday:'short', day:'numeric', month:'short'});
      html += `<div class="day-group"><div class="day-head"><span>${label}</span><span>${dayIn?('+ '+rupiah(dayIn)+' '):''}${dayOut?('- '+rupiah(dayOut)):''}</span></div>`;
      rows.forEach(r=>{
        const src = r.type==='masuk' ? CONFIG.income : CONFIG.budget;
        const label = (src[r.category] && src[r.category].label) ? src[r.category].label : r.category;
        html += `<div class="tx-row" data-id="${r.id}">
          <div>
            <div class="tx-cat">${label}</div>
            ${r.note ? `<div class="tx-note">${escapeHtml(r.note)}</div>` : ''}
          </div>
          <div style="text-align:right">
            <div class="tx-amt ${r.type==='masuk'?'in':'out'}">${r.type==='masuk'?'+':'-'} ${rupiah(r.amount)}</div>
            <button class="tx-del" data-del="${r.id}">Hapus</button>
          </div>
        </div>`;
      });
      html += `</div>`;
    });
    wrap.innerHTML = html;

    wrap.querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener('click', async (e)=>{
        e.stopPropagation();
        const id = b.dataset.del;
        TX = TX.filter(t=>t.id!==id);
        await saveTx();
        renderHeader();
        renderRiwayat();
        toast('Dihapus');
      });
    });
  }

  function escapeHtml(s){
    const d=document.createElement('div'); d.textContent=s; return d.innerHTML;
  }

  function renderAnggaran(){
    const mk = monthKey(todayISO());
    const spentByCat = {};
    TX.filter(t=>t.type==='keluar' && monthKey(t.date)===mk).forEach(t=>{
      spentByCat[t.category] = (spentByCat[t.category]||0) + t.amount;
    });

    let progHtml='';
    Object.keys(CONFIG.budget).forEach(k=>{
      const cfg = CONFIG.budget[k];
      const used = spentByCat[k]||0;
      const pct = cfg.bulanan>0 ? Math.min(100, (used/cfg.bulanan)*100) : 0;
      const over = used > cfg.bulanan;
      progHtml += `<div class="budget-card">
        <div class="bc-top"><span class="nm">${cfg.label}</span><span class="nums">${rupiah(used)} / ${rupiah(cfg.bulanan)}</span></div>
        <div class="bar-track"><div class="bar-fill ${over?'over':''}" style="width:${pct}%"></div></div>
      </div>`;
    });
    document.getElementById('budgetProgress').innerHTML = progHtml;

    let budgetEd = '<div class="grid3">';
    Object.keys(CONFIG.budget).forEach(k=>{
      budgetEd += `<div class="field"><label>${CONFIG.budget[k].label}</label>
        <input type="number" data-budget="${k}" value="${CONFIG.budget[k].bulanan}"></div>`;
    });
    budgetEd += '</div>';
    document.getElementById('budgetEditor').innerHTML = budgetEd;

    let incomeEd = '<div class="grid3">';
    Object.keys(CONFIG.income).forEach(k=>{
      incomeEd += `<div class="field"><label>${CONFIG.income[k].label}</label>
        <input type="number" data-income="${k}" value="${CONFIG.income[k].bulanan}"></div>`;
    });
    incomeEd += '</div>';
    document.getElementById('incomeEditor').innerHTML = incomeEd;

    document.getElementById('fSaldoAwal').value = CONFIG.saldoAwal;
  }

  document.getElementById('btnSimpanAnggaran').addEventListener('click', async ()=>{
    document.querySelectorAll('[data-budget]').forEach(inp=>{
      CONFIG.budget[inp.dataset.budget].bulanan = parseFloat(inp.value)||0;
    });
    document.querySelectorAll('[data-income]').forEach(inp=>{
      CONFIG.income[inp.dataset.income].bulanan = parseFloat(inp.value)||0;
    });
    CONFIG.saldoAwal = parseFloat(document.getElementById('fSaldoAwal').value)||0;
    await saveConfig();
    renderHeader();
    renderAnggaran();
    populateKategori();
    toast('Pengaturan tersimpan');
  });

  function renderRingkasan(){
    const groups = {};
    TX.forEach(t=>{
      const mk = monthKey(t.date);
      groups[mk] = groups[mk] || { inflow:0, outflow:0 };
      if(t.type==='masuk') groups[mk].inflow += t.amount;
      else groups[mk].outflow += t.amount;
    });

    const months = Object.keys(groups).sort((a,b)=>b.localeCompare(a));
    const wrap = document.getElementById('ringkasanList');

    if(months.length===0){
      wrap.innerHTML = '<div class="empty">Belum ada data bulan berjalan.</div>';
      return;
    }

    const { saldo: saldoSekarang } = computeSaldo();
    let runningEnd = saldoSekarang;
    let html='';
    months.forEach(mk=>{
      const g = groups[mk];
      const margin = g.inflow - g.outflow;
      const start = runningEnd - margin;
      html += `<div class="month-card">
        <div class="m-name">${monthLabel(mk)}</div>
        <div class="m-line"><span class="k">Uang awal</span><span class="v">${rupiah(start)}</span></div>
        <div class="m-line"><span class="k">Inflow</span><span class="v">${rupiah(g.inflow)}</span></div>
        <div class="m-line"><span class="k">Outflow</span><span class="v">${rupiah(g.outflow)}</span></div>
        <div class="m-line total"><span class="k">Uang akhir</span><span class="v">${rupiah(runningEnd)}</span></div>
      </div>`;
      runningEnd = start;
    });
    wrap.innerHTML = html;
  }

  (async function init(){
    await loadAll();
    populateKategori();
    renderHeader();
  })();

})();
</script>
</body>
</html>
